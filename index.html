<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مصروفي — إيرادات ومصروفات وادخار</title>
  <meta name="description" content="تطبيق مالية شخصي: إيرادات الإيجارات، مصروفات اليوم، المستحق غير المحصَّل، والادخار — يعمل أوفلاين ويُثبَّت على الجوال.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مصروفي">
  <meta name="format-detection" content="telephone=no">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="./assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png">

  <link rel="stylesheet" href="./assets/css/theme.css">
  <link rel="stylesheet" href="./assets/css/app.css">
  <link rel="stylesheet" href="./assets/css/domains.css">

  <script>
    /* تطبيق الوضع المحفوظ قبل أول رسم لتجنّب وميض الشاشة */
    (function () {
      try {
        var raw = localStorage.getItem('finapp.v1');
        var mode = raw ? (JSON.parse(raw).settings || {}).theme : 'light';
        if (mode === 'auto') {
          mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', mode === 'light' ? 'light' : 'dark');
      } catch (e) { /* الافتراضي نهاري (الهوية الجديدة) */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#view">تخطَّ إلى المحتوى</a>

  <div class="app-shell">
    <header class="app-header" id="app-header">
      <div class="app-header-main">
        <div class="app-brand">
          <span class="app-logo" id="app-logo" aria-hidden="true"></span>
          <div class="app-brand-text">
            <h1 class="app-title" id="app-title">مصروفي</h1>
            <div class="app-date" id="app-date">…</div>
          </div>
        </div>

        <div class="app-actions">
          <button type="button" class="header-btn nav-badge-host" id="nav-badge-btn" title="المستحق غير المحصَّل" aria-label="المستحق غير المحصَّل">
            <span class="header-ico" id="nav-badge-ico" aria-hidden="true"></span>
            <span class="nav-badge hidden" id="nav-badge"></span>
          </button>
          <button type="button" class="header-btn" id="quick-add-btn" title="إضافة مصروف (n)" aria-label="إضافة مصروف"><span class="header-ico" id="quick-add-ico" aria-hidden="true"></span></button>
          <button type="button" class="header-btn" id="theme-toggle" title="الوضع الليلي/النهاري (t)" aria-label="تبديل الوضع"></button>
          <!-- أيقونات الشاشات التي ليست تبويباً (المساعد) تُبنى من C.HEADER_LINKS -->
          <span id="header-links" class="header-links"></span>
          <a class="header-btn" href="#/settings" title="الإعدادات" aria-label="الإعدادات"><span class="header-ico" id="settings-ico" aria-hidden="true"></span></a>
        </div>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1">
      <div class="boot-loading">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p>جارٍ تحميل مصروفي…</p>
      </div>
    </main>

    <nav class="nav" id="nav" aria-label="التنقل الرئيسي"></nav>
  </div>

  <!-- بلا aria-live: قارئ الشاشة لا يجب أن ينطق الرسائل تلقائياً -->
  <div id="toasts" class="toasts"></div>

  <script>
    /* شبكة أمان: لا شاشة بيضاء صامتة. أي خطأ في أي ملف يُعرض بصراحة مع زر إعادة تحميل. */
    (function () {
      var shown = false;
      function showBanner(detail) {
        if (shown) return;
        shown = true;
        try {
          var host = document.getElementById('view');
          if (!host) return;
          var box = document.createElement('div');
          box.className = 'alert alert-danger';
          var ico = document.createElement('div');
          ico.className = 'alert-ico';
          ico.textContent = '!';
          var main = document.createElement('div');
          main.className = 'alert-main';
          var t = document.createElement('div');
          t.className = 'alert-title';
          t.textContent = 'تعذّر تشغيل التطبيق';
          var b = document.createElement('div');
          b.className = 'alert-body';
          b.textContent = String(detail || '') + ' — تأكد من أن كل ملفات assets/js محمّلة بلا أخطاء صياغة، ثم أعد التحميل.';
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn btn-primary';
          btn.textContent = 'إعادة التحميل';
          btn.onclick = function () { location.reload(); };
          main.appendChild(t); main.appendChild(b); main.appendChild(btn);
          box.appendChild(ico); box.appendChild(main);
          host.innerHTML = '';
          host.appendChild(box);
        } catch (e) { /* لا شيء نفعله */ }
      }
      window.addEventListener('error', function (e) {
        if (e && e.target && e.target.tagName === 'SCRIPT') {
          showBanner('فشل تحميل الملف: ' + (e.target.getAttribute('src') || ''));
          return;
        }
        showBanner((e && e.message) ? e.message : 'خطأ غير معروف');
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        showBanner('وعد مرفوض: ' + ((e && e.reason && e.reason.message) || ''));
      });
    })();
  </script>

  <!-- الترتيب مهم: الأساس أولاً (finance قبل store لأنه يُستخدم في البذرة) ثم الشاشات ثم الراوتر -->
  <script defer src="./assets/js/constants.js"></script>
  <script defer src="./assets/js/icons.js"></script>
  <script defer src="./assets/js/util.js"></script>
  <script defer src="./assets/js/finance.js"></script>
  <script defer src="./assets/js/store.js"></script>
  <script defer src="./assets/js/ui.js"></script>

  <script defer src="./assets/js/views/dashboard.js"></script>
  <script defer src="./assets/js/views/expenses.js"></script>
  <script defer src="./assets/js/views/income.js"></script>
  <script defer src="./assets/js/views/accounts.js"></script>
  <script defer src="./assets/js/views/reports.js"></script>
  <script defer src="./assets/js/views/domains.js"></script>
  <script defer src="./assets/js/views/settings.js"></script>
  <script defer src="./assets/js/views/agent.js"></script>

  <script defer src="./assets/js/agent.js"></script>
  <script defer src="./assets/js/app.js"></script>
</body>
</html>
